name: Generate Snake

concurrency:
  group: generate-snake
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5

      - name: Checkout output branch
        uses: actions/checkout@v5
        with:
          ref: output
          path: output-branch

      - name: Validate snake configuration
        env:
          PROFILE_SNAKE_SCOPE: ${{ vars.PROFILE_SNAKE_SCOPE || 'public' }}
          PROFILE_SNAKE_TOKEN: ${{ secrets.PROFILE_SNAKE_TOKEN }}
        run: |
          case "$PROFILE_SNAKE_SCOPE" in
            all|public|private)
              ;;
            *)
              echo "::error::PROFILE_SNAKE_SCOPE must be one of: all, public, private"
              exit 1
              ;;
          esac

          if [ "$PROFILE_SNAKE_SCOPE" != "public" ] && [ -z "$PROFILE_SNAKE_TOKEN" ]; then
            echo "::error::PROFILE_SNAKE_TOKEN is required when PROFILE_SNAKE_SCOPE is $PROFILE_SNAKE_SCOPE"
            exit 1
          fi

      - name: Generate contribution snake assets
        uses: HexAbyss/snk@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_SNAKE_TOKEN || github.token }}
          contribution_scope: ${{ vars.PROFILE_SNAKE_SCOPE || 'public' }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#2f6feb&color_dots=#dce9fb,#bfd6f6,#8dbdff,#64a1f4,#2f6feb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6ea8fe&color_dots=#0d1117,#0b2540,#103a63,#1a5a8c,#2f6feb

      - name: Publish snake assets to output branch
        run: |
          cp dist/github-snake.svg output-branch/github-snake.svg
          cp dist/github-snake-dark.svg output-branch/github-snake-dark.svg

          cd output-branch

          git add github-snake.svg github-snake-dark.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "snake"
          git push origin output
