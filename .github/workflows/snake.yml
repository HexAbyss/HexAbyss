name: Generate Snake

concurrency:
  group: generate-snake
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake assets
        uses: HexAbyss/snk@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_SIGNAL_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#2f6feb&color_dots=#dce9fb,#bfd6f6,#8dbdff,#64a1f4,#2f6feb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6ea8fe&color_dots=#0d1117,#0b2540,#103a63,#1a5a8c,#2f6feb

      - name: Publish snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
